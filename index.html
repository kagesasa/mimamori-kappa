<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>みまもりカッパ</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
</head>
<body>
  <header>
    <img src="assets/logo_k_mima.webp" alt="見守りカッパ" id="header-logo">
    <button id="settings-btn" aria-label="設定">⚙️ 設定</button>
  </header>

  <main>
    <div class="character-container">
      <img src="assets/kappa.webp" alt="カッパ" id="kappa-img">
      <p id="status-message">今日も1日よろしくね！</p>
    </div>

    <div class="main-action">
      <button id="genki-btn" class="giant-btn">元気だよ！</button>
    </div>
  </main>

  <footer>
    <button id="emergency-btn" class="danger-btn">緊急</button>
  </footer>

  <!-- Settings Modal -->
  <div id="settings-modal" class="modal hidden">
    <div class="modal-content">
      <h2>設定</h2>
      <div class="form-group">
        <label for="sender-email">ご自身のメールアドレス</label>
        <input type="email" id="sender-email" placeholder="your_email@gmail.com">
      </div>

      <div class="form-group">
        <label for="notification-email">通知先メールアドレス</label>
        <input type="email" id="notification-email" placeholder="example@gmail.com">
      </div>
      <div class="form-group">
        <label for="emergency-tel">緊急連絡先（電話番号）</label>
        <input type="tel" id="emergency-tel" placeholder="090-XXXX-XXXX">
      </div>
      <div class="modal-actions">
        <button id="save-settings-btn" class="primary-btn">保存</button>
        <button id="close-settings-btn" class="secondary-btn">閉じる</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
